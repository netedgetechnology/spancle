##############################################################################
# SPANCLE SPORTS OS — Local Development Stack
# docker-compose.yml
#
# Services:
#   - postgres    : Primary database (multi-tenant via RLS)
#   - redis       : Cache, pub/sub, queues (4 logical DBs)
#   - mailhog     : SMTP trap for local email testing
#   - redis-insight: Redis GUI (dev only)
#
# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose down -v   # removes volumes (destructive)
##############################################################################

version: '3.9'

networks:
  spancle-dev:
    driver: bridge
    name: spancle-dev-network

volumes:
  postgres_data:
    name: spancle_postgres_data
  redis_data:
    name: spancle_redis_data

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: spancle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spancle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spancle_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-spancle_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      # Performance tuning for dev (not for production)
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - spancle-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spancle} -d ${POSTGRES_DB:-spancle_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: spancle_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-spancle_redis_dev_password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - spancle-dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-spancle_redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # MailHog — SMTP trap (dev only)
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: spancle_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - spancle-dev
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # RedisInsight — Redis GUI (dev only)
  # ---------------------------------------------------------------------------
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: spancle_redis_insight
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - spancle-dev
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
