# =============================================================================
# SPANCLE SPORTS OS — nginx CORS + Security Headers Snippet
# infrastructure/nginx/snippets/cors.conf
#
# Usage: include /etc/nginx/snippets/cors.conf; in every API location block.
#
# ── Why security headers are bundled here ─────────────────────────────────────
# nginx add_header inheritance rule (from nginx docs):
#   "These directives are inherited from the previous configuration level if
#    and only if there are no add_header directives defined on the current level."
#
# If a location block defines ANY add_header (CORS headers, in this case),
# it SUPPRESSES all add_header directives from parent contexts (server, http).
# This means security-headers.conf included at the server{} level would be
# silently dropped for every location that also applies CORS headers.
#
# The fix: include security-headers.conf here so that both security headers
# and CORS headers are emitted together at the location level.
# security-headers.conf must NOT also be included at server{} level for
# these same location blocks — it is retained at server{} level only for
# locations that do not include cors.conf (e.g. /health, error pages).
#
# ── CORS origin validation ─────────────────────────────────────────────────────
# $cors_origin is set by the map block in spancle-api.conf.
# Allowed origins: see that map block for the full list.
# Unknown origins resolve to '' → no Allow-Origin header → browser blocks.
#
# ── OPTIONS preflight ─────────────────────────────────────────────────────────
# The browser sends OPTIONS before every cross-origin request. nginx handles
# it entirely here — no upstream round-trip — which prevents the case where
# the upstream returns a response with no CORS headers (status 204, 404, etc.)
# that the browser then treats as a failed preflight.
# =============================================================================

# ── Security headers (must be at location level — see note above) ─────────────
include /etc/nginx/snippets/security-headers.conf;

# ── CORS — OPTIONS preflight ──────────────────────────────────────────────────
if ($request_method = 'OPTIONS') {
    add_header  'Access-Control-Allow-Origin'      $cors_origin  always;
    add_header  'Access-Control-Allow-Credentials' 'true'        always;
    add_header  'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header  'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Tenant-Id, X-Request-ID' always;
    add_header  'Access-Control-Max-Age'           '86400'       always;
    add_header  'Content-Length'                   '0'           always;
    return 204;
}

# ── CORS — all other methods ──────────────────────────────────────────────────
add_header  'Access-Control-Allow-Origin'      $cors_origin  always;
add_header  'Access-Control-Allow-Credentials' 'true'        always;
add_header  'Access-Control-Expose-Headers'    'X-Request-ID, X-Total-Count' always;
