# =============================================================================
# SPANCLE SPORTS OS — nginx CORS Snippet
# infrastructure/nginx/snippets/cors.conf
#
# Usage: include /etc/nginx/snippets/cors.conf; in any location block that
# proxies to a NestJS service from a browser on a different origin.
#
# How it works:
#   1. Browser sends OPTIONS preflight. Nginx responds immediately (204) with
#      the required Access-Control-* headers — no proxy round-trip needed.
#      This avoids the case where the upstream returns 204/404 with no CORS
#      headers, which the browser treats as a failed preflight.
#
#   2. For all other methods (GET, POST, PATCH, etc.), the Access-Control-*
#      headers are added to the proxied upstream response via add_header.
#      The upstream (NestJS) also emits these headers; nginx does not strip them.
#
# Allowed origins:
#   manage.spancle.com  — Superadmin portal
#   www.spancle.com     — Public website (consumer booking flow)
#   localhost:3000/3001 — Local development
#
# To add a new allowed origin (e.g. a new tenant dashboard domain), add it
# to the map block in /etc/nginx/conf.d/spancle-api.conf.
# =============================================================================

# OPTIONS preflight: respond immediately with CORS headers, no upstream call.
if ($request_method = 'OPTIONS') {
    add_header  'Access-Control-Allow-Origin'      $cors_origin  always;
    add_header  'Access-Control-Allow-Credentials' 'true'        always;
    add_header  'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header  'Access-Control-Allow-Headers'
        'Authorization, Content-Type, Accept, X-Tenant-Id, X-Request-ID' always;
    add_header  'Access-Control-Max-Age'           '86400'       always;
    add_header  'Content-Type'                     'text/plain'  always;
    add_header  'Content-Length'                   '0'           always;
    return 204;
}

# All other methods: add CORS headers to the proxied response.
add_header  'Access-Control-Allow-Origin'      $cors_origin  always;
add_header  'Access-Control-Allow-Credentials' 'true'        always;
add_header  'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
add_header  'Access-Control-Allow-Headers'
    'Authorization, Content-Type, Accept, X-Tenant-Id, X-Request-ID' always;
add_header  'Access-Control-Expose-Headers'
    'X-Request-ID, X-Total-Count' always;
