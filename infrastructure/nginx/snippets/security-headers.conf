# =============================================================================
# SPANCLE SPORTS OS — nginx Security Headers
# infrastructure/nginx/snippets/security-headers.conf
#
# OWASP-aligned security headers for all Spancle server blocks.
# Usage: include /etc/nginx/snippets/security-headers.conf;
# =============================================================================

# ── Clickjacking protection ───────────────────────────────────────────────────
add_header  X-Frame-Options  "SAMEORIGIN"  always;

# ── MIME type sniffing prevention ─────────────────────────────────────────────
add_header  X-Content-Type-Options  "nosniff"  always;

# ── XSS protection (legacy browsers) ─────────────────────────────────────────
add_header  X-XSS-Protection  "1; mode=block"  always;

# ── Referrer policy ───────────────────────────────────────────────────────────
add_header  Referrer-Policy  "strict-origin-when-cross-origin"  always;

# ── Permissions policy ────────────────────────────────────────────────────────
add_header  Permissions-Policy  "camera=(), microphone=(), geolocation=()"  always;

# ── Content Security Policy ───────────────────────────────────────────────────
# NOTE: This is a permissive baseline — tighten per application in Sprint 3.
# Do NOT add unsafe-inline or unsafe-eval in production without a nonce strategy.
add_header  Content-Security-Policy
    "default-src 'self'; \
     script-src 'self' 'nonce-$request_id'; \
     style-src 'self' 'unsafe-inline'; \
     img-src 'self' data: https://assets.spancle.io; \
     font-src 'self'; \
     connect-src 'self' https://api.spancle.io; \
     frame-ancestors 'none'; \
     base-uri 'self'; \
     form-action 'self'"
    always;

# ── Hide server identity ──────────────────────────────────────────────────────
add_header  Server  "Spancle"  always;
more_clear_headers  "X-Powered-By";
