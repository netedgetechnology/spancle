# =============================================================================
# SPANCLE SPORTS OS — nginx SSL Configuration Snippet
# infrastructure/nginx/snippets/ssl.conf
#
# Usage: include /etc/nginx/snippets/ssl.conf; in HTTPS server blocks.
# Enable AFTER running: sudo certbot --nginx -d yourdomain.com
#
# Certificate paths follow Let's Encrypt / Certbot conventions.
# Replace DOMAIN_NAME with the actual domain before enabling.
# =============================================================================

# ── Certificate paths (Certbot managed) ──────────────────────────────────────
# ssl_certificate      /etc/letsencrypt/live/DOMAIN_NAME/fullchain.pem;
# ssl_certificate_key  /etc/letsencrypt/live/DOMAIN_NAME/privkey.pem;
# ssl_trusted_certificate /etc/letsencrypt/live/DOMAIN_NAME/chain.pem;

# ── TLS protocol versions ────────────────────────────────────────────────────
# Disable TLS 1.0 and 1.1 — EOL, PCI-DSS non-compliant
ssl_protocols  TLSv1.2 TLSv1.3;

# ── Cipher suite ─────────────────────────────────────────────────────────────
# Modern cipher list — prioritises AEAD ciphers and forward secrecy
ssl_ciphers  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers  off;

# ── DH parameters (forward secrecy) ──────────────────────────────────────────
# Generate: sudo openssl dhparam -out /etc/nginx/dhparam.pem 2048
ssl_dhparam  /etc/nginx/dhparam.pem;

# ── OCSP stapling ─────────────────────────────────────────────────────────────
ssl_stapling         on;
ssl_stapling_verify  on;
resolver             8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout     5s;

# ── Session cache ─────────────────────────────────────────────────────────────
ssl_session_cache    shared:SSL:10m;
ssl_session_timeout  1d;
ssl_session_tickets  off;

# ── HSTS (HTTP Strict Transport Security) ────────────────────────────────────
# 2-year max-age — only enable once you are 100% committed to HTTPS
add_header  Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload"  always;
