# =============================================================================
# SPANCLE SPORTS OS — nginx Proxy Parameters Snippet
# infrastructure/nginx/snippets/proxy-params.conf
#
# Usage: include /etc/nginx/snippets/proxy-params.conf; in every location block
# that proxies to a NestJS or NextJS upstream.
# =============================================================================

# ── Protocol upgrade support ──────────────────────────────────────────────────
proxy_http_version  1.1;
proxy_set_header    Upgrade     $http_upgrade;
proxy_set_header    Connection  "upgrade";

# ── Real IP forwarding ────────────────────────────────────────────────────────
proxy_set_header    Host              $host;
proxy_set_header    X-Real-IP         $remote_addr;
proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Host  $host;
proxy_set_header    X-Forwarded-Port  $server_port;
proxy_set_header    X-Forwarded-Proto $scheme;

# ── Spancle application headers ───────────────────────────────────────────────
# Preserve the tenant ID header — required by TenantGuard
proxy_set_header    X-Tenant-Id       $http_x_tenant_id;

# Attach unique request ID for distributed tracing
proxy_set_header    X-Request-ID      $request_id;

# ── Cache control ─────────────────────────────────────────────────────────────
# Do not cache API responses at nginx level — application handles caching
proxy_no_cache       1;
proxy_cache_bypass   1;

# ── Buffering ─────────────────────────────────────────────────────────────────
# Disable response buffering for streaming endpoints (SSE, long-poll)
proxy_buffering      off;
proxy_request_buffering  off;

# ── Timeout ───────────────────────────────────────────────────────────────────
proxy_connect_timeout  10s;
proxy_read_timeout     60s;
proxy_send_timeout     30s;
