# =============================================================================
# SPANCLE SPORTS OS — nginx Rate Limiting Zones
# infrastructure/nginx/snippets/rate-limit.conf
#
# Included in the http {} block of nginx.conf.
# Zones are referenced in location blocks within conf.d/*.conf.
#
# Zone naming convention:
#   api_*  — backend NestJS service routes
#   web_*  — NextJS frontend app routes
#   auth_* — authentication endpoints (stricter limits)
# =============================================================================

# ── API rate limiting zones ───────────────────────────────────────────────────

# General API zone — 10 requests/second per IP
# 10m shared memory = ~160,000 IP entries
limit_req_zone  $binary_remote_addr  zone=api_general:10m  rate=10r/s;

# Per-IP strict zone — 3 requests/second per IP
limit_req_zone  $binary_remote_addr  zone=api_per_ip:10m  rate=3r/s;

# Auth zone — 1 request/second per IP (prevents brute-force at nginx layer)
# NestJS ThrottlerGuard provides a second layer of defence
limit_req_zone  $binary_remote_addr  zone=auth_strict:5m  rate=1r/s;

# Tenant-scoped zone — 30 requests/second per tenant ID
# Uses x-tenant-id header value as the rate limit key
limit_req_zone  $http_x_tenant_id  zone=api_per_tenant:10m  rate=30r/s;

# ── Web app rate limiting zones ───────────────────────────────────────────────

# General web zone — 30 requests/second per IP
limit_req_zone  $binary_remote_addr  zone=web_general:10m  rate=30r/s;

# ── Connection limiting zones ─────────────────────────────────────────────────

# Limit concurrent connections per IP — prevents slow-loris attacks
limit_conn_zone  $binary_remote_addr  zone=conn_per_ip:10m;

# ── Rate limit response ────────────────────────────────────────────────────────
# Return 429 instead of default 503 when rate limit exceeded
limit_req_status   429;
limit_conn_status  429;
