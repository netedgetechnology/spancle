# =============================================================================
# SPANCLE SPORTS OS — nginx Main Configuration
# infrastructure/nginx/nginx.conf
#
# Target: Ubuntu 22.04 LTS, nginx 1.24+
# Install path: /etc/nginx/nginx.conf
#
# Copy command:
#   sudo cp infrastructure/nginx/nginx.conf /etc/nginx/nginx.conf
#   sudo cp -r infrastructure/nginx/conf.d/* /etc/nginx/conf.d/
#   sudo cp -r infrastructure/nginx/snippets/* /etc/nginx/snippets/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

user  www-data;

# Auto-detect CPU cores — on single server, 1 per core is optimal
worker_processes  auto;

# Increase file descriptor limit
worker_rlimit_nofile  65535;

# Error log
error_log  /var/log/nginx/error.log warn;

pid  /run/nginx.pid;


events {
    # Max simultaneous connections per worker
    # formula: worker_connections * worker_processes = max total connections
    worker_connections  2048;

    # Accept multiple connections per wake-up (Linux only)
    multi_accept  on;

    # Use epoll event model (Linux, most efficient)
    use  epoll;
}


http {
    # ── MIME types ────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging format ────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '$request_time $upstream_response_time '
                      '"$http_x_tenant_id" "$http_x_request_id"';

    # JSON log format — for log aggregation pipelines
    log_format  json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"tenant_id":"$http_x_tenant_id",'
            '"request_id":"$http_x_request_id",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;

    # ── Buffer tuning ─────────────────────────────────────────────────────────
    client_body_buffer_size     16k;
    client_header_buffer_size   2k;
    client_max_body_size        10m;
    large_client_header_buffers 4 8k;

    # Proxy buffer sizing for NestJS responses
    proxy_buffer_size          16k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    client_body_timeout    30s;
    client_header_timeout  15s;
    send_timeout           30s;

    proxy_connect_timeout  10s;
    proxy_read_timeout     60s;
    proxy_send_timeout     30s;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    4;
    gzip_min_length    1024;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        text/css
        text/plain
        text/xml
        image/svg+xml
        application/xml
        application/xml+rss;

    # ── Security ──────────────────────────────────────────────────────────────
    # Hide nginx version from error pages and headers
    server_tokens  off;

    # Prevent click-jacking by default (overridden per location if needed)
    add_header  X-Frame-Options  SAMEORIGIN  always;

    # ── Rate limiting zones (referenced in conf.d/spancle-api.conf) ───────────
    include  /etc/nginx/snippets/rate-limit.conf;

    # ── Virtual hosts ─────────────────────────────────────────────────────────
    include  /etc/nginx/conf.d/*.conf;
}
