# =============================================================================
# SPANCLE SPORTS OS — nginx API Server
# infrastructure/nginx/conf.d/spancle-api.conf
#
# Routes all API traffic through path-based upstream selection.
# CORS is handled entirely at the nginx layer — see snippets/cors.conf.
#
# Request flow:
#   Browser → OPTIONS preflight → nginx returns 204 with CORS headers (no upstream)
#   Browser → GET/POST/...    → nginx proxies to upstream, adds CORS headers to response
#
# Deploy:
#   sudo cp infrastructure/nginx/conf.d/spancle-api.conf /etc/nginx/conf.d/
#   sudo cp infrastructure/nginx/snippets/cors.conf      /etc/nginx/snippets/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── CORS origin allowlist ─────────────────────────────────────────────────────
# Maps the incoming Origin request header to the value used in
# Access-Control-Allow-Origin. Unlisted origins map to '' (empty), which
# means no CORS header is sent and the browser blocks the request.
# This is correct and intentional — it is not a 403, it is simply no grant.
#
# Regex entries (tilde prefix) match before literal entries within the same
# map block. Literal entries take precedence over 'default'.
map $http_origin $cors_origin {
    default  '';

    # ── Production: named portals ─────────────────────────────────────────────
    'https://manage.spancle.com'  $http_origin;   # Superadmin portal
    'https://www.spancle.com'     $http_origin;   # Public website
    'https://spancle.com'         $http_origin;   # Apex redirect target

    # ── Production: tenant subdomains ─────────────────────────────────────────
    # Matches https://<slug>.spancle.com where slug is one or more
    # lowercase alphanumeric / hyphen characters.
    # The regex is anchored (^...$) so it cannot be bypassed by embedding
    # a valid subdomain inside a longer hostname (e.g. evil.spancle.com.evil.com).
    ~^https://[a-z0-9][a-z0-9-]*\.spancle\.com$  $http_origin;

    # ── Local development ─────────────────────────────────────────────────────
    'http://localhost:3000'   $http_origin;
    'http://localhost:3001'   $http_origin;
    'http://localhost:3002'   $http_origin;
    'http://127.0.0.1:3000'  $http_origin;
    'http://127.0.0.1:3001'  $http_origin;
}

# =============================================================================
# HTTP server — api.spancle.com
# (HTTPS block is at the bottom; enable after cert provisioning)
# =============================================================================
server {
    listen       80;
    listen       [::]:80;
    server_name  api.spancle.com api.spancle.io;

    # Security headers are applied at location level via cors.conf (see note
    # in that file about add_header inheritance). The include here covers only
    # locations that do NOT include cors.conf (/health, error pages, etc.).
    include  /etc/nginx/snippets/security-headers.conf;

    # Request ID for distributed tracing — set before location matching.
    add_header  X-Request-ID  $request_id  always;

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        access_log  off;
        return  200  '{"status":"ok","service":"nginx"}';
        add_header  Content-Type  application/json  always;
    }

    # ── Identity Service ──────────────────────────────────────────────────────
    # /api/v1/auth/*, /api/v1/users/*, /api/v1/identities/*,
    # /api/v1/roles/*, /api/v1/sports/*, /api/v1/courts/*,
    # /api/v1/branches/*, /api/v1/onboarding/*
    location ~ ^/api/v1/(auth|users|identities|roles|sports|courts|branches|onboarding) {
        limit_req  zone=api_general  burst=50  nodelay;
        limit_req  zone=api_per_ip   burst=20  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_identity;
    }

    # ── SaaS Platform — CMS ───────────────────────────────────────────────────
    # Must appear before the tenants|subscriptions|plans block.
    # nginx regex locations are matched in declaration order (first match wins).
    location ~ ^/api/v1/cms {
        limit_req  zone=api_general  burst=50  nodelay;
        limit_req  zone=api_per_ip   burst=20  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_saas_platform;
    }

    # ── SaaS Platform — Tenants / Subscriptions / Plans ──────────────────────
    # /api/v1/tenants/*, /api/v1/subscriptions/*, /api/v1/plans/*
    location ~ ^/api/v1/(tenants|subscriptions|plans) {
        limit_req  zone=api_general  burst=30  nodelay;
        limit_req  zone=api_per_ip   burst=10  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_saas_platform;
    }

    # ── Booking Service ───────────────────────────────────────────────────────
    # /api/v1/bookings/*, /api/v1/slots/*, /api/v1/venues/*,
    # /api/v1/rate-cards/*, /api/v1/pricing-rules/*, /api/v1/slot-templates/*,
    # /api/v1/blackouts/*, /api/v1/holidays/*, /api/v1/qr/*
    location ~ ^/api/v1/(bookings|slots|venues|rate-cards|pricing-rules|slot-templates|blackouts|holidays|qr) {
        limit_req  zone=api_general  burst=50  nodelay;
        limit_req  zone=api_per_ip   burst=20  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_booking;
    }

    # ── Finance Service ───────────────────────────────────────────────────────
    # /api/v1/invoices/*, /api/v1/payments/*, /api/v1/wallets/*
    location ~ ^/api/v1/(invoices|payments|wallets) {
        limit_req  zone=api_general  burst=20  nodelay;
        limit_req  zone=api_per_ip   burst=5   nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_finance;
    }

    # ── Tournament Service ────────────────────────────────────────────────────
    # /api/v1/tournaments/*, /api/v1/brackets/*, /api/v1/matches/*
    location ~ ^/api/v1/(tournaments|brackets|matches) {
        limit_req  zone=api_general  burst=40  nodelay;
        limit_req  zone=api_per_ip   burst=15  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_tournament;
    }

    # ── Academy Service ───────────────────────────────────────────────────────
    # /api/v1/academies/*, /api/v1/players/*, /api/v1/coaches/*
    location ~ ^/api/v1/(academies|players|coaches) {
        limit_req  zone=api_general  burst=40  nodelay;
        limit_req  zone=api_per_ip   burst=15  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_academy;
    }

    # ── Communication Service ─────────────────────────────────────────────────
    # /api/v1/notifications/*, /api/v1/messages/*, /api/v1/templates/*
    location ~ ^/api/v1/(notifications|messages|templates) {
        limit_req  zone=api_general  burst=30  nodelay;
        limit_req  zone=api_per_ip   burst=10  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_communication;
    }

    # ── Reporting Service ─────────────────────────────────────────────────────
    # /api/v1/reports/*, /api/v1/dashboards/*, /api/v1/metrics/*
    # Extended read timeout — report generation can take up to 60 s.
    location ~ ^/api/v1/(reports|dashboards|metrics) {
        limit_req  zone=api_general  burst=10  nodelay;
        limit_req  zone=api_per_ip   burst=5   nodelay;
        proxy_read_timeout  120s;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_reporting;
    }

    # ── Admin stats ───────────────────────────────────────────────────────────
    # /api/v1/admin/* — routed to SaaS platform service
    location ~ ^/api/v1/admin {
        limit_req  zone=api_general  burst=20  nodelay;
        limit_req  zone=api_per_ip   burst=10  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_saas_platform;
    }

    # ── Catch-all 404 for unknown /api paths ──────────────────────────────────
    location /api/ {
        # No cors.conf here — unknown routes do not need CORS headers.
        # The browser will block these (correct: they are not real endpoints).
        add_header  Content-Type  application/json  always;
        return  404  '{"statusCode":404,"error":"Not Found","message":"API route not found"}';
    }

    # ── Upstream error pages ──────────────────────────────────────────────────
    error_page  502 503 504  @gateway_error;
    location @gateway_error {
        default_type  application/json;
        return  502  '{"statusCode":502,"error":"Bad Gateway","message":"Service temporarily unavailable"}';
    }
}

# =============================================================================
# HTTPS — enable after cert provisioning
# sudo certbot --nginx -d api.spancle.com -d api.spancle.io
#
# After certbot runs, add the server block below and reload nginx.
# The HTTP server above will be modified by certbot to redirect to HTTPS.
# =============================================================================
#
# server {
#     listen       443 ssl http2;
#     listen       [::]:443 ssl http2;
#     server_name  api.spancle.com api.spancle.io;
#
#     include  /etc/nginx/snippets/ssl.conf;
#     include  /etc/nginx/snippets/security-headers.conf;  # covers /health
#
#     add_header  X-Request-ID  $request_id  always;
#
#     # Paste the same location blocks from the HTTP server above.
#     # Every location block that proxies to an upstream must include:
#     #   include /etc/nginx/snippets/cors.conf;
#     #   include /etc/nginx/snippets/proxy-params.conf;
# }
