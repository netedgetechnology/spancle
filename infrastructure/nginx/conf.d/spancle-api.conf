# =============================================================================
# SPANCLE SPORTS OS — nginx API Server
# infrastructure/nginx/conf.d/spancle-api.conf
#
# Exposes all 8 backend services under a single API domain.
# Path-based routing: /api/v1/{resource}/* → upstream spancle_{service}
#
# CORS:
#   Handled at the nginx layer for all API location blocks.
#   The $cors_origin map below validates the request Origin header against
#   the allowed list. Unknown origins get an empty string, which means the
#   browser will not receive Access-Control-Allow-Origin and will block the
#   request — this is the correct and intended behaviour.
#
#   The actual CORS headers are applied via:
#     include /etc/nginx/snippets/cors.conf;
#   in each location block.  OPTIONS preflights are handled there and
#   return 204 immediately without touching the upstream.
# =============================================================================

# ── CORS origin whitelist ─────────────────────────────────────────────────────
# Map the incoming Origin header to a safe return value.
# Unmatched origins produce an empty string → no CORS header → browser blocks.
map $http_origin $cors_origin {
    default                              '';

    # Production — Superadmin portal
    'https://manage.spancle.com'        $http_origin;

    # Production — Public website (consumer booking, tenant portals)
    'https://www.spancle.com'           $http_origin;
    'https://spancle.com'               $http_origin;

    # Production — Wildcard tenant subdomains (e.g. acme.spancle.com)
    '~^https://[a-z0-9-]+\.spancle\.com$'  $http_origin;

    # Local development
    'http://localhost:3000'             $http_origin;
    'http://localhost:3001'             $http_origin;
    'http://localhost:3002'             $http_origin;
    'http://127.0.0.1:3000'            $http_origin;
    'http://127.0.0.1:3001'            $http_origin;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  api.spancle.com api.spancle.io;

    # ── Security headers ──────────────────────────────────────────────────────
    include  /etc/nginx/snippets/security-headers.conf;

    # ── Request ID — unique ID for distributed tracing ────────────────────────
    add_header  X-Request-ID  $request_id  always;

    # ── Health check — nginx-level (no upstream required) ─────────────────────
    location = /health {
        access_log  off;
        return  200  '{"status":"ok","service":"nginx"}';
        add_header  Content-Type  application/json  always;
    }

    # ── Identity Service ──────────────────────────────────────────────────────
    # /api/v1/auth/*, /api/v1/users/*, /api/v1/roles/*, /api/v1/sports/*,
    # /api/v1/courts/*, /api/v1/branches/*, /api/v1/onboarding/*
    location ~ ^/api/v1/(auth|users|identities|roles|sports|courts|branches|onboarding) {
        limit_req  zone=api_general  burst=50  nodelay;
        limit_req  zone=api_per_ip  burst=20  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_identity;
    }

    # ── SaaS Platform Service — CMS routes ───────────────────────────────────
    # Must appear before the tenants block — nginx uses longest-prefix match
    # for non-regex but first-match for regex; explicit ordering avoids
    # ambiguity when both patterns could match.
    location ~ ^/api/v1/cms {
        limit_req  zone=api_general  burst=50  nodelay;
        limit_req  zone=api_per_ip  burst=20  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_saas_platform;
    }

    # ── SaaS Platform Service — Tenants / Subscriptions / Plans ──────────────
    # /api/v1/tenants/*, /api/v1/subscriptions/*, /api/v1/plans/*
    location ~ ^/api/v1/(tenants|subscriptions|plans) {
        limit_req  zone=api_general  burst=30  nodelay;
        limit_req  zone=api_per_ip  burst=10  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_saas_platform;
    }

    # ── Booking Service ───────────────────────────────────────────────────────
    # /api/v1/bookings/*, /api/v1/slots/*, /api/v1/venues/*,
    # /api/v1/rate-cards/*, /api/v1/pricing-rules/*, /api/v1/slot-templates/*,
    # /api/v1/blackouts/*, /api/v1/holidays/*, /api/v1/qr/*
    location ~ ^/api/v1/(bookings|slots|venues|rate-cards|pricing-rules|slot-templates|blackouts|holidays|qr) {
        limit_req  zone=api_general  burst=50  nodelay;
        limit_req  zone=api_per_ip  burst=20  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_booking;
    }

    # ── Finance Service ───────────────────────────────────────────────────────
    # /api/v1/invoices/*, /api/v1/payments/*, /api/v1/wallets/*
    location ~ ^/api/v1/(invoices|payments|wallets) {
        limit_req  zone=api_general  burst=20  nodelay;
        limit_req  zone=api_per_ip  burst=5  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_finance;
    }

    # ── Tournament Service ────────────────────────────────────────────────────
    location ~ ^/api/v1/(tournaments|brackets|matches) {
        limit_req  zone=api_general  burst=40  nodelay;
        limit_req  zone=api_per_ip  burst=15  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_tournament;
    }

    # ── Academy Service ───────────────────────────────────────────────────────
    location ~ ^/api/v1/(academies|players|coaches) {
        limit_req  zone=api_general  burst=40  nodelay;
        limit_req  zone=api_per_ip  burst=15  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_academy;
    }

    # ── Communication Service ─────────────────────────────────────────────────
    location ~ ^/api/v1/(notifications|messages|templates) {
        limit_req  zone=api_general  burst=30  nodelay;
        limit_req  zone=api_per_ip  burst=10  nodelay;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_communication;
    }

    # ── Reporting Service ─────────────────────────────────────────────────────
    location ~ ^/api/v1/(reports|dashboards|metrics) {
        limit_req  zone=api_general  burst=10  nodelay;
        limit_req  zone=api_per_ip  burst=5  nodelay;
        proxy_read_timeout  120s;
        include    /etc/nginx/snippets/cors.conf;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_reporting;
    }

    # ── Catch-all: 404 for unknown /api routes ────────────────────────────────
    location /api/ {
        include  /etc/nginx/snippets/cors.conf;
        return   404  '{"statusCode":404,"error":"Not Found","message":"API route not found"}';
        add_header  Content-Type  application/json  always;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page  502 503 504  @gateway_error;
    location @gateway_error {
        default_type  application/json;
        return  502  '{"statusCode":502,"error":"Bad Gateway","message":"Service temporarily unavailable"}';
    }
}

