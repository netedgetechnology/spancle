# =============================================================================
# SPANCLE SPORTS OS — nginx Upstream Definitions
# infrastructure/nginx/conf.d/upstream.conf
#
# Upstream names mirror PM2 process names for operational clarity.
# Ports mirror packages/constants/src/api.constants.ts SERVICE_PORTS.
#
# Single-server deployment: all upstreams point to 127.0.0.1.
# Multi-server migration: replace 127.0.0.1 with internal LAN IPs
# and add additional server entries per service node.
# =============================================================================

# ── NestJS Backend Services ───────────────────────────────────────────────────

# identity-service — PORT: 4001
upstream spancle_identity {
    least_conn;
    server  127.0.0.1:4001  max_fails=3  fail_timeout=30s;
    keepalive  16;
}

