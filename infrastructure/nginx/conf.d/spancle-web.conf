# =============================================================================
# SPANCLE SPORTS OS — nginx Web App Virtual Hosts
# infrastructure/nginx/conf.d/spancle-web.conf
#
# Routes browser traffic to the appropriate NextJS application by subdomain.
#
# Domain map:
#   spancle.io              → public-website        (port 3010)
#   admin.spancle.io        → superadmin-portal     (port 3011)
#   app.spancle.io          → tenant-portal         (port 3012)
#   *.app.spancle.io        → tenant-portal         (port 3012, subdomain tenant)
#   book.spancle.io         → consumer-booking      (port 3013)
#   *.book.spancle.io       → consumer-booking      (port 3013, white-label)
# =============================================================================

# ── Public Website ────────────────────────────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  spancle.io www.spancle.io;

    include  /etc/nginx/snippets/security-headers.conf;

    # NextJS static assets — aggressive caching
    location /_next/static/ {
        proxy_pass         http://spancle_web_public;
        proxy_cache_valid  200  365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        include            /etc/nginx/snippets/proxy-params.conf;
    }

    # NextJS image optimization
    location /_next/image {
        proxy_pass  http://spancle_web_public;
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=30  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_web_public;
    }
}

# ── Superadmin Portal ─────────────────────────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  admin.spancle.io;

    include  /etc/nginx/snippets/security-headers.conf;

    # Restrict to known office/VPN IPs in production
    # allow  10.0.0.0/8;
    # deny   all;

    location /_next/static/ {
        proxy_pass  http://spancle_web_admin;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=10  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_web_admin;
    }
}

# ── Tenant Portal — Base domain ───────────────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  app.spancle.io;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://spancle_web_tenant;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=30  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_web_tenant;
    }
}

# ── Tenant Portal — Subdomain tenants (*.app.spancle.io) ─────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  ~^(?<tenant_slug>[^.]+)\.app\.spancle\.io$;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://spancle_web_tenant;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req   zone=web_general  burst=30  nodelay;
        # Pass tenant slug to NextJS middleware for resolution
        proxy_set_header  X-Tenant-Slug  $tenant_slug;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://spancle_web_tenant;
    }
}

# ── Consumer Booking — Base domain ────────────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  book.spancle.io;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://spancle_web_booking;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=50  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_web_booking;
    }
}

# ── Consumer Booking — White-label subdomains (*.book.spancle.io) ─────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  ~^(?<tenant_slug>[^.]+)\.book\.spancle\.io$;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://spancle_web_booking;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req   zone=web_general  burst=50  nodelay;
        proxy_set_header  X-Tenant-Slug  $tenant_slug;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://spancle_web_booking;
    }
}
