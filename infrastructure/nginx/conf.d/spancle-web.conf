# =============================================================================
# SPANCLE SPORTS OS — nginx Web App Virtual Hosts
# infrastructure/nginx/conf.d/spancle-web.conf
#
# Domain map:
#   www.spancle.com         → public-website       (port 3000)
#   manage.spancle.com      → superadmin-portal    (port 3001)
#   <slug>.spancle.com      → tenant-portal        (port 3003)
#   booking.spancle.com     → redirect → www.spancle.com
# =============================================================================

# ── HTTP → HTTPS redirects for known domains ─────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  spancle.com www.spancle.com;
    return 301 https://www.spancle.com$request_uri;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  manage.spancle.com admin.spancle.com;
    return 301 https://manage.spancle.com$request_uri;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  booking.spancle.com book.spancle.com book.spancle.io;
    return 301 https://www.spancle.com;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  ~^[^.]+.book.spancle.(com|io)$;
    return 301 https://www.spancle.com;
}

# ── Public Website HTTPS ─────────────────────────────────────────────────────
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  spancle.com www.spancle.com;

    ssl_certificate      /etc/letsencrypt/live/spancle.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/spancle.com/privkey.pem;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_cache_valid  200  365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        include            /etc/nginx/snippets/proxy-params.conf;
    }

    location /_next/image {
        proxy_pass  http://127.0.0.1:3000;
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=30  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}

# ── Superadmin / Master Admin HTTPS ──────────────────────────────────────────
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  manage.spancle.com;

    ssl_certificate      /etc/letsencrypt/live/manage.spancle.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/manage.spancle.com/privkey.pem;

    include  /etc/nginx/snippets/security-headers.conf;

    auth_basic "Spancle Super Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-spancle-manage;
    
    location /_next/static/ {
        proxy_pass  http://127.0.0.1:3001;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=10  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:3001;
    }
}

# ── Old admin domain HTTPS redirect ──────────────────────────────────────────
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  admin.spancle.com;

    ssl_certificate      /etc/letsencrypt/live/spancle.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/spancle.com/privkey.pem;

    return 301 https://manage.spancle.com$request_uri;
}

# ── Booking redirect HTTPS ───────────────────────────────────────────────────
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  booking.spancle.com book.spancle.com;

    ssl_certificate      /etc/letsencrypt/live/spancle.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/spancle.com/privkey.pem;

    return 301 https://www.spancle.com;
}

# ── Wildcard tenant routing HTTP ─────────────────────────────────────────────
# Temporary HTTP tenant support until wildcard SSL is issued.
server {
    listen       80;
    listen       [::]:80;
    server_name  ~^(?<tenant_slug>[^.]+).spancle.com$;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://127.0.0.1:3003;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location /_next/image {
        proxy_pass  http://127.0.0.1:3003;
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req   zone=web_general  burst=30  nodelay;
        proxy_set_header  X-Tenant-Slug  $tenant_slug;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://127.0.0.1:3003;
    }
}

# ── Legacy app.spancle.io HTTP only during DNS transition ────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  app.spancle.io ~^(?<tenant_slug>[^.]+).app.spancle.io$;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://127.0.0.1:3003;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req   zone=web_general  burst=30  nodelay;
        proxy_set_header  X-Tenant-Slug  $tenant_slug;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://127.0.0.1:3003;
    }
}

# ── Custom tenant domains ────────────────────────────────────────────────────
# Add per-tenant custom domain server blocks below or in separate conf.d files.

# ── HTTPS: Wildcard Tenant Routing ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ~^(?<tenant_slug>[^.]+).spancle.com$;

    ssl_certificate     /etc/letsencrypt/live/spancle.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spancle.com-0001/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req zone=web_general burst=30 nodelay;
        proxy_set_header X-Tenant-Slug $tenant_slug;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:3003;
    }
}
