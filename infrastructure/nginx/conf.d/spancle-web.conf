# =============================================================================
# SPANCLE SPORTS OS — nginx Web App Virtual Hosts
# infrastructure/nginx/conf.d/spancle-web.conf
#
# Domain map (final production architecture):
#   www.spancle.com         → public-website         (port 3000)
#   manage.spancle.com      → superadmin-portal       (port 3001)
#   <slug>.spancle.com      → tenant-portal           (port 3002)  [wildcard]
#   booking.spancle.com     → redirect → www.spancle.com
#   book.spancle.com        → redirect → www.spancle.com
#
# NOTE: More-specific server_name entries (www, manage, api, booking) MUST
# be defined BEFORE the wildcard regex block. Nginx tries exact names first,
# then prefix, then regex in order — so explicit blocks are always safe.
# =============================================================================

# ── Public Website ────────────────────────────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  spancle.com www.spancle.com;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass         http://spancle_web_public;
        proxy_cache_valid  200  365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        include            /etc/nginx/snippets/proxy-params.conf;
    }

    location /_next/image {
        proxy_pass  http://spancle_web_public;
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=30  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_web_public;
    }
}

# ── Superadmin / Master Admin ─────────────────────────────────────────────────
# Final URL: manage.spancle.com  (renamed from admin.spancle.com)
# admin.spancle.com kept as alias during DNS transition — remove after cutover.
server {
    listen       80;
    listen       [::]:80;
    server_name  manage.spancle.com admin.spancle.com;

    include  /etc/nginx/snippets/security-headers.conf;

    # Optional: restrict to known office/VPN IPs in production
    # allow  10.0.0.0/8;
    # deny   all;

    location /_next/static/ {
        proxy_pass  http://spancle_web_admin;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=10  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://spancle_web_admin;
    }
}

# ── Booking redirect ──────────────────────────────────────────────────────────
# booking.spancle.com / book.spancle.com must NOT serve a booking app.
# Booking lives at tenantname.spancle.com/booking — not a global subdomain.
server {
    listen       80;
    listen       [::]:80;
    server_name  booking.spancle.com book.spancle.com book.spancle.io;

    return 301 https://www.spancle.com$request_uri;
}

# ── Wildcard booking subdomains redirect ──────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  ~^[^.]+.book.spancle.(com|io)$;

    return 301 https://www.spancle.com;
}

# ── Legacy: *.app.spancle.io — keep during DNS transition ─────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  app.spancle.io ~^(?<tenant_slug>[^.]+).app.spancle.io$;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://spancle_web_tenant;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req   zone=web_general  burst=30  nodelay;
        proxy_set_header  X-Tenant-Slug  $tenant_slug;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://spancle_web_tenant;
    }
}

# ── Wildcard tenant routing: *.spancle.com → tenant portal ───────────────────
#
# Matches any subdomain NOT already claimed by a more-specific server_name
# block above (www, manage, api, booking, book).
# Injects X-Tenant-Slug for Next.js edge middleware.
# The middleware validates the slug and rejects reserved names.
server {
    listen       80;
    listen       [::]:80;
    server_name  ~^(?<tenant_slug>[^.]+).spancle.com$;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://spancle_web_tenant;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location /_next/image {
        proxy_pass  http://spancle_web_tenant;
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req   zone=web_general  burst=30  nodelay;
        proxy_set_header  X-Tenant-Slug  $tenant_slug;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://spancle_web_tenant;
    }
}

