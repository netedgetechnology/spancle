# =============================================================================
# SPANCLE SPORTS OS — nginx Web App Virtual Hosts
# infrastructure/nginx/conf.d/spancle-web.conf
#
# Domain map:
#   www.spancle.com         → public-website       (port 3000)
#   manage.spancle.com      → superadmin-portal    (port 3001)
#   <slug>.spancle.com      → tenant-portal        (port 3003)
#   booking.spancle.com     → redirect → www.spancle.com
# =============================================================================

# ── CORS origin allowlist ─────────────────────────────────────────────────────
# Maps the incoming Origin header to the value used in Access-Control-Allow-Origin.
# Unlisted origins resolve to '' — no CORS header is sent, browser blocks correctly.
map $http_origin $cors_origin {
    default                                        '';
    https://manage.spancle.com                     $http_origin;
    https://www.spancle.com                        $http_origin;
    https://spancle.com                            $http_origin;
    ~^https://[a-z0-9][a-z0-9-]*\.spancle\.com$ $http_origin;
    http://localhost:3000                          $http_origin;
    http://localhost:3001                          $http_origin;
}


# ── HTTP → HTTPS redirects for known domains ─────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  spancle.com www.spancle.com;
    return 301 https://www.spancle.com$request_uri;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  manage.spancle.com admin.spancle.com;
    return 301 https://manage.spancle.com$request_uri;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  booking.spancle.com book.spancle.com book.spancle.io;
    return 301 https://www.spancle.com;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  ~^[^.]+.book.spancle.(com|io)$;
    return 301 https://www.spancle.com;
}

# ── Public Website HTTPS ─────────────────────────────────────────────────────
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  spancle.com www.spancle.com;

    ssl_certificate      /etc/letsencrypt/live/spancle.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/spancle.com/privkey.pem;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_cache_valid  200  365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        include            /etc/nginx/snippets/proxy-params.conf;
    }

    location /_next/image {
        proxy_pass  http://127.0.0.1:3000;
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=30  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}

# ── Superadmin / Master Admin HTTPS ──────────────────────────────────────────
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  manage.spancle.com;

    ssl_certificate      /etc/letsencrypt/live/manage.spancle.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/manage.spancle.com/privkey.pem;

    include  /etc/nginx/snippets/security-headers.conf;

    auth_basic "Spancle Super Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-spancle-manage;
    
    location /_next/static/ {
        proxy_pass  http://127.0.0.1:3001;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req  zone=web_general  burst=10  nodelay;
        include    /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:3001;
    }
}

# ── Old admin domain HTTPS redirect ──────────────────────────────────────────
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  admin.spancle.com;

    ssl_certificate      /etc/letsencrypt/live/spancle.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/spancle.com/privkey.pem;

    return 301 https://manage.spancle.com$request_uri;
}

# ── Booking redirect HTTPS ───────────────────────────────────────────────────
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  booking.spancle.com book.spancle.com;

    ssl_certificate      /etc/letsencrypt/live/spancle.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/spancle.com/privkey.pem;

    return 301 https://www.spancle.com;
}

# ── Wildcard tenant routing HTTP ─────────────────────────────────────────────
# Temporary HTTP tenant support until wildcard SSL is issued.
server {
    listen       80;
    listen       [::]:80;
    server_name  ~^(?<tenant_slug>[^.]+).spancle.com$;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://127.0.0.1:3003;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location /_next/image {
        proxy_pass  http://127.0.0.1:3003;
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req   zone=web_general  burst=30  nodelay;
        proxy_set_header  X-Tenant-Slug  $tenant_slug;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://127.0.0.1:3003;
    }
}

# ── Legacy app.spancle.io HTTP only during DNS transition ────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  app.spancle.io ~^(?<tenant_slug>[^.]+).app.spancle.io$;

    include  /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass  http://127.0.0.1:3003;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        include     /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req   zone=web_general  burst=30  nodelay;
        proxy_set_header  X-Tenant-Slug  $tenant_slug;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://127.0.0.1:3003;
    }
}

# ── Custom tenant domains ────────────────────────────────────────────────────
# Add per-tenant custom domain server blocks below or in separate conf.d files.

# ── HTTPS: Wildcard Tenant Routing ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ~^(?<tenant_slug>[^.]+).spancle.com$;

    ssl_certificate     /etc/letsencrypt/live/spancle.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spancle.com-0001/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req zone=web_general burst=30 nodelay;
        proxy_set_header X-Tenant-Slug $tenant_slug;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:3003;
    }
}

# ── API Gateway HTTPS ─────────────────────────────────────────────────────────
# Routes browser API calls from manage.spancle.com (and other portals) to the
# NestJS backend services running on localhost.
#
# Direct proxy_pass targets (no upstream blocks):
#   127.0.0.1:4001  identity-service
#   127.0.0.1:4002  saas-platform-service (tenants, subscriptions, plans, admin)
#
# CORS is handled entirely at this layer:
#   OPTIONS preflight  → nginx returns 204 immediately (no upstream round-trip)
#   All other methods  → CORS headers added to the proxied response
#
# The $cors_origin map above validates the Origin header — unknown origins
# receive no Access-Control-Allow-Origin and are blocked by the browser.
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  api.spancle.com;

    ssl_certificate      /etc/letsencrypt/live/api.spancle.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/api.spancle.com/privkey.pem;

    include  /etc/nginx/snippets/security-headers.conf;

    # ── CORS preflight handler (shared across all API locations) ──────────────
    # Defined once here at server level, but nginx `if` does not inherit into
    # location blocks — the actual CORS logic is in each location via the
    # set of add_header directives below the `if` block.
    #
    # Pattern: each location block repeats the if+add_header block.
    # To avoid duplication a nested location approach is used:
    # all /api/v1/* traffic first hits the CORS block, then is proxied.

    # ── Identity service — /api/v1/auth/*, /api/v1/users/*, etc. ─────────────
    location ~ ^/api/v1/(auth|users|identities|roles|sports|courts|branches|onboarding) {
        if ($request_method = 'OPTIONS') {
            add_header  'Access-Control-Allow-Origin'      $cors_origin  always;
            add_header  'Access-Control-Allow-Credentials' 'true'        always;
            add_header  'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header  'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Tenant-Id, X-Request-ID' always;
            add_header  'Access-Control-Max-Age'           '86400'       always;
            add_header  'Content-Length'                   '0'           always;
            return 204;
        }
        add_header  'Access-Control-Allow-Origin'      $cors_origin  always;
        add_header  'Access-Control-Allow-Credentials' 'true'        always;
        add_header  'Access-Control-Expose-Headers'    'X-Request-ID, X-Total-Count' always;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://127.0.0.1:4001;
    }

    # ── SaaS platform service — /api/v1/tenants/*, /api/v1/admin/*, etc. ─────
    location ~ ^/api/v1/(tenants|subscriptions|plans|cms|admin) {
        if ($request_method = 'OPTIONS') {
            add_header  'Access-Control-Allow-Origin'      $cors_origin  always;
            add_header  'Access-Control-Allow-Credentials' 'true'        always;
            add_header  'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header  'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Tenant-Id, X-Request-ID' always;
            add_header  'Access-Control-Max-Age'           '86400'       always;
            add_header  'Content-Length'                   '0'           always;
            return 204;
        }
        add_header  'Access-Control-Allow-Origin'      $cors_origin  always;
        add_header  'Access-Control-Allow-Credentials' 'true'        always;
        add_header  'Access-Control-Expose-Headers'    'X-Request-ID, X-Total-Count' always;
        include     /etc/nginx/snippets/proxy-params.conf;
        proxy_pass  http://127.0.0.1:4002;
    }

    # ── Catch-all for unknown /api routes ─────────────────────────────────────
    location /api/ {
        add_header  Content-Type  application/json  always;
        return  404  '{"statusCode":404,"error":"Not Found","message":"API route not found"}';
    }

    error_page  502 503 504  @gateway_error;
    location @gateway_error {
        default_type  application/json;
        return  502  '{"statusCode":502,"error":"Bad Gateway","message":"Service temporarily unavailable"}';
    }
}

# ── API Gateway HTTP → HTTPS redirect ────────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  api.spancle.com;
    return 301   https://api.spancle.com$request_uri;
}
